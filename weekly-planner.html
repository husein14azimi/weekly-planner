<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Weekly planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1b2430;
            --mut: #5d6a7a;
            --line: #d5dbe3;
            --bg: #eef1f5;
            --acc: #24407a;
            font: 15px/1.5 Vazirmatn, system-ui, sans-serif;
            color: var(--ink)
        }

        * {
            box-sizing: border-box
        }

        [hidden] {
            display: none !important
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg)
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem 1rem;
            align-items: center;
            padding: .5rem 1rem;
            background: #fff;
            border-block-end: 1px solid var(--line)
        }

        h1 {
            font-size: 1.1rem;
            margin: 0;
            margin-inline-end: auto
        }

        .tb {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem
        }

        button {
            font: inherit;
            padding: .3rem .7rem;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #fff;
            color: inherit;
            cursor: pointer
        }

        button:hover:not(:disabled) {
            border-color: var(--acc)
        }

        button:disabled {
            opacity: .45;
            cursor: default
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px
        }

        #warn {
            margin: 0;
            padding: .4rem 1rem;
            background: #fde8c8
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0
        }

        #W {
            flex: 1;
            overflow: auto;
            scroll-padding-block-start: 2.4rem;
            scroll-padding-inline-start: 3.8rem
        }

        #G {
            display: grid;
            grid-template-columns: 3.8rem repeat(7, minmax(6.5rem, 1fr));
            min-width: max-content;
            width: 100%;
            user-select: none;
            outline: 0;
            background: #fff
        }

        #G>* {
            min-height: 3.1rem;
            padding: .2rem .45rem;
            overflow: hidden;
            border-inline-end: 1px solid var(--line);
            border-block-end: 1px solid var(--line)
        }

        #G>.hd,
        #G>.hh,
        #G>.corner {
            position: sticky;
            background: #f6f8fa;
            font-weight: 600;
            font-size: .85rem;
            color: var(--mut);
            cursor: pointer
        }

        #G>.hd {
            inset-block-start: 0;
            z-index: 2;
            min-height: 2.4rem;
            display: grid;
            place-items: center
        }

        #G>.hh {
            inset-inline-start: 0;
            z-index: 1;
            text-align: end
        }

        #G>.corner {
            inset-block-start: 0;
            inset-inline-start: 0;
            z-index: 3;
            min-height: 2.4rem
        }

        .c b,
        .c i {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.35
        }

        .c b {
            font-size: .85rem
        }

        .c i {
            font-size: .74rem;
            font-style: normal;
            opacity: .85
        }

        #G>.sel {
            outline: 2px solid #1d4ed8;
            outline-offset: -2px;
            box-shadow: inset 0 0 0 99rem #1d4ed81f
        }

        #G>.cur {
            outline-width: 3px
        }

        aside {
            width: 21rem;
            overflow: auto;
            padding: 1rem;
            background: #fff;
            border-inline-start: 1px solid var(--line)
        }

        aside h2 {
            font-size: .95rem;
            margin: 1.2rem 0 .4rem
        }

        aside h2:first-child {
            margin-top: 0
        }

        aside label,
        #col>span {
            display: block;
            font-size: .85rem;
            color: var(--mut);
            margin: .6rem 0 .2rem
        }

        aside label.sa {
            display: flex;
            gap: .4rem;
            align-items: center;
            margin: .3rem 0
        }

        #cnt {
            margin: 0;
            color: var(--mut)
        }

        input[type=text] {
            width: 100%;
            padding: .4rem .5rem;
            border: 1px solid var(--line);
            border-radius: 4px;
            font: inherit
        }

        .cb {
            position: relative
        }

        #sg {
            position: absolute;
            inset-inline: 0;
            top: 100%;
            margin: 2px 0 0;
            padding: 0;
            list-style: none;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 4px;
            max-height: 14rem;
            overflow: auto;
            z-index: 5;
            box-shadow: 0 6px 18px #0002
        }

        #sg li {
            display: flex;
            gap: .5rem;
            align-items: center;
            padding: .35rem .5rem;
            cursor: pointer
        }

        #sg li[aria-selected=true],
        #sg li:hover {
            background: #e6edfb
        }

        .sw {
            width: .9rem;
            height: .9rem;
            border-radius: 50%;
            border: 1px solid #0003;
            flex: none
        }

        #pal {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem;
            align-items: center
        }

        #pal button {
            width: 1.6rem;
            height: 1.6rem;
            padding: 0;
            border-radius: 50%
        }

        #pal input {
            width: 1.8rem;
            height: 1.8rem;
            padding: 0;
            border: 0;
            background: none
        }

        #col.off #pal {
            opacity: .35;
            pointer-events: none
        }

        #cnote {
            margin: .3rem 0 0;
            font-size: .8rem;
            color: var(--mut)
        }

        #TL {
            list-style: none;
            padding: 0;
            margin: 0 0 .6rem
        }

        #TL li {
            display: flex;
            gap: .4rem;
            align-items: center;
            margin-block: .3rem
        }

        #TL input[type=color] {
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: none;
            flex: none
        }

        #TL small {
            color: var(--mut);
            white-space: nowrap
        }

        dialog {
            border: 1px solid var(--line);
            border-radius: 8px;
            max-width: 26rem
        }

        dialog div {
            display: flex;
            gap: .5rem;
            justify-content: end
        }

        @media(max-width:760px) {
            main {
                flex-direction: column
            }

            aside {
                width: auto;
                max-height: 45vh;
                border-inline-start: 0;
                border-block-start: 1px solid var(--line)
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 data-i="app"></h1>
        <div class="tb">
            <button data-a="undo" data-i="undo"></button><button data-a="redo" data-i="redo"></button>
            <button data-a="copy" data-i="copy"></button><button data-a="paste" data-i="paste"></button><button
                data-a="clear" data-i="clear"></button>
            <button data-a="exp" data-i="exp"></button><button data-a="imp" data-i="imp"></button><button data-a="reset"
                data-i="reset"></button>
            <button data-a="lang"></button><button data-a="dig"></button>
        </div>
    </header>
    <p id="warn" hidden></p>
    <main>
        <div id="W">
            <div id="G" role="grid" tabindex="0"></div>
        </div>
        <aside>
            <h2 data-i="sel"></h2>
            <p id="cnt"></p>
            <label for="ti" data-i="titleL"></label>
            <div class="cb"><input id="ti" type="text" dir="auto" role="combobox" aria-controls="sg"
                    aria-autocomplete="list" aria-expanded="false" autocomplete="off">
                <ul id="sg" role="listbox" hidden></ul>
            </div>
            <label class="sa" hidden><input id="sa" type="checkbox" checked><span data-i="save"></span></label>
            <label for="ca" data-i="capL"></label><input id="ca" type="text" dir="auto" autocomplete="off">
            <div id="col"><span data-i="colorL"></span>
                <div id="pal"></div>
            </div>
            <p id="cnote"></p>
            <h2 data-i="tasks"></h2>
            <ul id="TL"></ul><button id="add" data-i="add"></button>
        </aside>
    </main>
    <dialog id="dlg">
        <form method="dialog">
            <p></p>
            <div><button value="n" data-i="no"></button><button value="y"></button></div>
        </form>
    </dialog>
    <input id="fi" type="file" accept=".json,application/json" hidden>
    <script>
        'use strict';

        /* ---------- strings (en / fa) ---------- */

                samples: ['Work', 'Study', 'Exercise', 'Meals', 'Rest'], newTask: 'New task', standup: 'Standup', walk: 'Walk',

                delMsg: (n, a, b) => `“${iso(n)}” is used in ${N(a)} cells, with ${N(b)} captions. Delete it together with those captions?`,

                impMsg: 'برنامهٔ فعلی با این فایل جایگزین شود؟', bad: 'این فایل یک خروجی معتبر برنامه نیست.', resetMsg: 'همه‌چیز با داده‌های نمونه جایگزین شود؟',
                mem: 'ذخیره‌سازی مرورگر در دسترس نیست. تغییرات فقط در حافظه می‌مانند؛ برای نگه‌داشتن، خروجی بگیرید.'

        const iso = s => '\u2068' + s + '\u2069', tr = (k, ...a) => { const v = L[lang][k]; return typeof v == 'function' ? v(...a) : v }, N = x => nf.format(x), rtl = () => lang == 'fa', uid = () => Math.random().toString(36).slice(2, 8), key = (d, h) => d + '-' + h;
        const G = $('#G'), ti = $('#ti'), ca = $('#ca'), sg = $('#sg'), sa = $('#sa'), dlg = $('#dlg'), TL = $('#TL'), col = $('#col'), fi = $('#fi');
        /* ---------- storage ---------- */

        const save = () => LS.save();
        function ok(d) { return !!(d && Array.isArray(d.tasks) && d.cells && typeof d.cells == 'object' && d.tasks.every(k => k && typeof k.id == 'string' && typeof k.name == 'string' && HEX.test(k.color))) }
        function clean(d) {

        const lin = c => c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4, gam = c => c <= .0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - .055, rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255), lum = ([r, g, b]) => .2126 * r + .7152 * g + .0722 * b, ic = {};

        function undo() { if (!un.length) return; re.push(snap()); S = JSON.parse(un.pop()); save(); render() }
        function redo() { if (!re.length) return; un.push(snap()); S = JSON.parse(re.pop()); save(); render() }
        const R = () => ({ d0: Math.min(sel.a[0], sel.b[0]), d1: Math.max(sel.a[0], sel.b[0]), h0: Math.min(sel.a[1], sel.b[1]), h1: Math.max(sel.a[1], sel.b[1]) });
        const picked = () => { const r = R(), o = []; for (let d = r.d0; d <= r.d1; d++)for (let h = r.h0; h <= r.h1; h++)o.push([d, h]); return o };

        /* ---------- loose task matching ---------- */
        const norm = s => s.toLowerCase().replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[\u200c\u064b-\u065f\u0670]/g, '').replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/\s+/g, ' ').trim();

        }
        /* ---------- rendering ---------- */
        function renderGrid() {
            G.textContent = ''; EL = {};
            const add = (c, x, at = {}) => { const e = document.createElement('div'); e.className = c; e.textContent = x; for (const k in at) e.setAttribute(k, at[k]); G.append(e); return e };

            }

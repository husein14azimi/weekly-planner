<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
    <title>Weekly planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1b2430;
            --mut: #5d6a7a;
            --line: #d5dbe3;
            --bg: #f3f5f8;
            --surface: #ffffff;
            --surface-subtle: #f8fafc;
            --acc: #24407a;
            --acc-light: #e8eef9;
            --acc-hover: #1b3260;
            --sel-bg: rgba(36, 64, 122, 0.14);
            --sel-border: #1d4ed8;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            --header-h: 56px;
            font: 15px/1.5 'Vazirmatn', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        [hidden] {
            display: none !important;
        }

        body {
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }

        /* --- Header --- */
        header {
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            z-index: 20;
            flex-shrink: 0;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            color: var(--acc);
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: var(--ink);
            letter-spacing: -0.01em;
        }

        .tb {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* --- Buttons & Inputs --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            border-color: var(--acc);
            background: var(--acc-light);
            color: var(--acc);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .btn.btn-primary {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc);
        }

        .btn.btn-primary:hover:not(:disabled) {
            background: var(--acc-hover);
            color: #fff;
        }

        .btn.btn-icon {
            padding: 0;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
        }

        .btn.btn-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn.btn-danger {
            color: var(--danger);
            border-color: #fca5a5;
        }

        .btn.btn-danger:hover:not(:disabled) {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: var(--danger);
        }

        #rngBtn[aria-pressed="true"] {
            background: var(--acc);
            color: #fff;
            border-color: var(--acc);
        }

        :focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 2px;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem 0.65rem;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            font: inherit;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--surface);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus {
            border-color: var(--acc);
            outline: none;
            box-shadow: 0 0 0 3px var(--acc-light);
        }

        /* --- Warning Banner --- */
        #warn {
            margin: 0;
            padding: 0.5rem 1rem;
            background: #fef3c7;
            color: #92400e;
            font-size: 0.85rem;
            border-bottom: 1px solid #fde68a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        /* --- Main Layout --- */
        main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        #gridWrapper {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--bg);
            -webkit-overflow-scrolling: touch;
        }

        #G {
            display: grid;
            grid-template-columns: 4rem repeat(7, minmax(7rem, 1fr));
            min-width: max-content;
            width: 100%;
            background: var(--surface);
            user-select: none;
            outline: 0;
        }

        #G > * {
            min-height: 3.25rem;
            padding: 0.25rem 0.45rem;
            border-inline-end: 1px solid var(--line);
            border-block-end: 1px solid var(--line);
            position: relative;
        }

        #G > .hd,
        #G > .hh,
        #G > .corner {
            background: var(--surface-subtle);
            font-weight: 600;
            font-size: 0.84rem;
            color: var(--mut);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }

        #G > .hd:hover,
        #G > .hh:hover {
            background: var(--acc-light);
            color: var(--acc);
        }

        #G > .hd {
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 2.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 0 var(--line);
        }

        #G > .hh {
            position: sticky;
            inset-inline-start: 0;
            z-index: 9;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-inline-end: 0.6rem;
            box-shadow: inset -1px 0 0 var(--line);
        }

        html[dir="rtl"] #G > .hh {
            box-shadow: inset 1px 0 0 var(--line);
        }

        #G > .corner {
            position: sticky;
            top: 0;
            inset-inline-start: 0;
            z-index: 11;
            min-height: 2.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 1px 1px 0 var(--line);
        }

        .c {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: background-color 0.1s ease;
        }

        .c b,
        .c i {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.35;
        }

        .c b {
            font-size: 0.86rem;
            font-weight: 600;
        }

        .c i {
            font-size: 0.75rem;
            font-style: normal;
            opacity: 0.85;
            margin-top: 1px;
        }

        #G > .sel {
            outline: 2px solid var(--sel-border);
            outline-offset: -2px;
            box-shadow: inset 0 0 0 9999px var(--sel-bg);
            z-index: 1;
        }

        #G > .cur {
            outline-width: 3px;
            z-index: 2;
        }

        /* --- Side Panel (Desktop) --- */
        aside#sidePanel {
            width: 22rem;
            overflow-y: auto;
            background: var(--surface);
            border-inline-start: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 15;
        }

        .panel-container {
            padding: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* --- Tabs --- */
        .tabs-header {
            display: flex;
            border-radius: var(--radius-sm);
            background: var(--bg);
            padding: 3px;
            gap: 2px;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .tab-btn {
            flex: 1;
            border: 0;
            background: transparent;
            font: inherit;
            font-weight: 600;
            font-size: 0.86rem;
            padding: 0.45rem 0.75rem;
            border-radius: 4px;
            color: var(--mut);
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .tab-btn:hover {
            color: var(--ink);
        }

        .tab-btn.active {
            background: var(--surface);
            color: var(--acc);
            box-shadow: var(--shadow-sm);
        }

        /* Panel sections */
        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .panel-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .field-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--mut);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        #cnt {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--acc);
        }

        /* Combobox */
        .combobox-wrap {
            position: relative;
        }

        #sg {
            position: absolute;
            inset-inline: 0;
            top: calc(100% + 4px);
            margin: 0;
            padding: 4px;
            list-style: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            max-height: 14rem;
            overflow-y: auto;
            z-index: 30;
            box-shadow: var(--shadow-lg);
        }

        #sg li {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            padding: 0.45rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: background 0.1s;
        }

        #sg li[aria-selected="true"],
        #sg li:hover {
            background: var(--acc-light);
            color: var(--acc);
        }

        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .save-task-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            cursor: pointer;
            user-select: none;
        }

        .save-task-wrap input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--acc);
            cursor: pointer;
        }

        .actions-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        /* Palette */
        #pal {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            align-items: center;
        }

        .pal-btn {
            width: 1.85rem;
            height: 1.85rem;
            padding: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--mut);
        }

        .pal-btn:hover {
            transform: scale(1.12);
        }

        .pal-btn.clear-color {
            background: #f1f5f9;
            border: 1px dashed var(--line);
        }

        #customColorInput {
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
        }

        #col.off #pal {
            opacity: 0.35;
            pointer-events: none;
        }

        #cnote {
            margin: 0;
            font-size: 0.8rem;
            color: var(--mut);
            line-height: 1.4;
        }

        /* Tasks Tab List */
        #TL {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #TL li {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0.4rem 0.5rem;
            background: var(--surface-subtle);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
        }

        #TL input[type="color"] {
            width: 26px;
            height: 26px;
            padding: 0;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            background: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        #TL input[type="text"] {
            flex: 1;
            padding: 0.35rem 0.5rem;
            min-height: 32px;
            font-size: 0.88rem;
        }

        #TL small {
            font-size: 0.78rem;
            color: var(--mut);
            white-space: nowrap;
        }

        #TL .btn-del {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--mut);
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            font-size: 0.9rem;
        }

        #TL .btn-del:hover {
            color: var(--danger);
            background: var(--danger-bg);
            border-color: #fca5a5;
        }

        /* --- Popover Menu --- */
        .popover-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 99;
            backdrop-filter: blur(1px);
        }

        .popover-menu {
            position: absolute;
            top: calc(var(--header-h) - 4px);
            inset-inline-end: 1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            z-index: 100;
            min-width: 190px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.55rem 0.8rem;
            font-size: 0.88rem;
            color: var(--ink);
            background: transparent;
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            text-align: start;
            font: inherit;
        }

        .menu-item:hover {
            background: var(--acc-light);
            color: var(--acc);
        }

        .menu-divider {
            height: 1px;
            background: var(--line);
            margin: 4px 0;
        }

        /* --- Modal Dialog (Confirm/Alert) --- */
        .dialog-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 200;
            backdrop-filter: blur(2px);
        }

        .dialog-box {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            animation: dialogPop 0.15s ease-out;
        }

        @keyframes dialogPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .dialog-msg {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--ink);
            margin: 0;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
        }

        /* --- Toast Notification --- */
        #toast {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #ffffff;
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            box-shadow: var(--shadow-lg);
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(4px);
        }

        /* --- Mobile Bottom Sheet & Responsive --- */
        .mo {
            display: none;
        }

        #bottomSheetBackdrop {
            display: none;
        }

        @media (max-width: 768px) {
            .mo {
                display: inline-flex;
            }

            .btn {
                min-height: 40px;
            }

            .btn.btn-icon {
                width: 40px;
                height: 40px;
            }

            input[type="text"] {
                font-size: 16px; /* prevent iOS/Android zoom */
                min-height: 42px;
            }

            #G {
                grid-template-columns: 3.4rem repeat(7, calc((100vw - 3.4rem) / 3.75));
            }

            /* Move side panel to bottom sheet */
            aside#sidePanel {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                border-inline-start: 0;
                border-top: 1px solid var(--line);
                border-radius: 18px 18px 0 0;
                box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.12);
                transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1), height 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
                z-index: 50;
                max-height: 85dvh;
                touch-action: pan-y;
            }

            .sheet-handle-bar {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 8px 0 4px;
                cursor: grab;
                background: var(--surface);
                border-radius: 18px 18px 0 0;
                user-select: none;
            }

            .sheet-handle {
                width: 40px;
                height: 4px;
                background: var(--line);
                border-radius: 4px;
            }

            /* Sheet States */
            aside#sidePanel[data-state="peek"] {
                transform: translateY(0);
                height: 195px;
            }

            aside#sidePanel[data-state="peek"] .more-fields {
                display: none;
            }

            aside#sidePanel[data-state="full"] {
                transform: translateY(0);
                height: 80dvh;
            }

            aside#sidePanel[data-state="hidden"] {
                transform: translateY(100%);
            }

            #bottomSheetBackdrop {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.35);
                z-index: 45;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.25s;
            }

            #bottomSheetBackdrop.active {
                opacity: 1;
                pointer-events: auto;
            }

            .panel-container {
                padding: 0 1rem 1.5rem;
                overflow-y: auto;
                flex: 1;
            }

            #sg {
                position: static;
                box-shadow: none;
                max-height: 10rem;
                margin-top: 4px;
            }

            .pal-btn, #customColorInput {
                width: 2.25rem;
                height: 2.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- App Header -->
    <header>
        <div class="brand-area">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <h1 data-i="app">Weekly planner</h1>
        </div>

        <div class="tb">
            <button class="btn btn-icon" id="undoBtn" data-a="undo" data-t="undo" aria-label="Undo">
                <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            </button>
            <button class="btn btn-icon" id="redoBtn" data-a="redo" data-t="redo" aria-label="Redo">
                <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
            <button class="btn mo" id="rngBtn" aria-pressed="false" data-i="rng">Range</button>
            <button class="btn btn-icon" id="menuBtn" data-t="more" aria-label="More" aria-haspopup="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
            </button>
        </div>
    </header>

    <!-- Menu Popover -->
    <div id="menuBackdrop" class="popover-backdrop" hidden></div>
    <div id="menuPopover" class="popover-menu" hidden>
        <button class="menu-item" data-a="exp"><span data-i="exp">Export</span> 💾</button>
        <button class="menu-item" data-a="imp"><span data-i="imp">Import</span> 📂</button>
        <button class="menu-item" data-a="reset"><span data-i="reset">Reset samples</span> 🔄</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-a="lang"><span data-i="langToggle">Language</span> <b id="lgVal">FA</b></button>
        <button class="menu-item" data-a="dig" id="digItem"><span data-i="digits">Digits</span> <b id="dgVal">۱۲۳</b></button>
    </div>

    <!-- Storage Failure Warning Banner -->
    <p id="warn" hidden><span data-i="mem">Browser storage is unavailable. Changes live in memory only; use Export to keep them.</span></p>

    <!-- Main Workspace -->
    <main>
        <div id="gridWrapper">
            <div id="G" role="grid" tabindex="0"></div>
        </div>

        <div id="bottomSheetBackdrop"></div>

        <!-- Sidebar / Bottom Sheet -->
        <aside id="sidePanel" data-state="peek">
            <div class="sheet-handle-bar mo" id="sheetHandle">
                <div class="sheet-handle"></div>
            </div>

            <div class="panel-container">
                <div class="tabs-header">
                    <button class="tab-btn active" id="tabCellBtn" data-tab="c"><span data-i="tabC">Cell</span></button>
                    <button class="tab-btn" id="tabTasksBtn" data-tab="t"><span data-i="tasks">Tasks</span></button>
                </div>

                <!-- Tab: Cell -->
                <div class="panel-section" id="secCell">
                    <p id="cnt">1 cell selected</p>

                    <div class="panel-field">
                        <label class="field-label" for="ti" data-i="titleL">Task or text</label>
                        <div class="combobox-wrap">
                            <input id="ti" type="text" dir="auto" role="combobox" aria-controls="sg" aria-autocomplete="list" aria-expanded="false" autocomplete="off">
                            <ul id="sg" role="listbox" hidden></ul>
                        </div>
                    </div>

                    <label class="save-task-wrap" id="saWrap" hidden>
                        <input id="sa" type="checkbox" checked>
                        <span data-i="save">Save as task</span>
                    </label>

                    <div class="actions-bar">
                        <button class="btn" data-a="copy" data-i="copy">Copy</button>
                        <button class="btn" data-a="paste" data-i="paste">Paste</button>
                        <button class="btn btn-danger" data-a="clear" data-i="clear">Clear</button>
                    </div>

                    <div class="more-fields">
                        <div class="panel-field">
                            <label class="field-label" for="ca" data-i="capL">Caption</label>
                            <input id="ca" type="text" dir="auto" autocomplete="off">
                        </div>

                        <div class="panel-field" id="col">
                            <span class="field-label" data-i="colorL">Color</span>
                            <div id="pal"></div>
                            <p id="cnote"></p>
                        </div>
                    </div>
                </div>

                <!-- Tab: Tasks -->
                <div class="panel-section" id="secTasks" hidden>
                    <ul id="TL"></ul>
                    <button class="btn btn-primary" id="addTaskBtn" style="width:100%;"><span data-i="add">Add task</span> +</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- Modal Dialog System -->
    <div id="dialogBackdrop" class="dialog-backdrop" hidden>
        <div class="dialog-box" role="dialog" aria-modal="true">
            <p class="dialog-msg" id="dialogMsg"></p>
            <div class="dialog-actions">
                <button class="btn" id="dialogCancelBtn" data-i="no">Cancel</button>
                <button class="btn btn-primary" id="dialogConfirmBtn" data-i="ok">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Hidden File Input for JSON Import -->
    <input id="fi" type="file" accept=".json,application/json" hidden>

    <script>
        'use strict';
        const START = 5, END = 22, ND = 7, HEX = /^#[0-9a-f]{6}$/i, $ = s => document.querySelector(s);
        const PAL = ['#1f6f4a', '#b8e2c8', '#2a5ea8', '#c3d8f3', '#b3402e', '#f4c5bb', '#e0a82e', '#f7e59a', '#6b3fa0', '#dccbf1', '#0e7c86', '#e3e6ea'];

        /* ---------- Strings & i18n (English & Persian) ---------- */
        const L = {
            en: {
                app: 'Weekly planner',
                days: ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                undo: 'Undo', redo: 'Redo', copy: 'Copy', paste: 'Paste', clear: 'Clear',
                exp: 'Export', imp: 'Import', reset: 'Reset samples',
                sel: 'Selection', tasks: 'Tasks', titleL: 'Task or text', capL: 'Caption', colorL: 'Color',
                mixed: 'Mixed', rng: 'Range', tabC: 'Cell', more: 'More', close: 'Close',
                save: 'Save as task', add: 'Add task', no: 'Cancel', ok: 'Confirm',
                yes: 'Yes, delete', del: 'Delete', lang: 'English', langToggle: 'Language', digits: 'Digits',
                samples: ['Work', 'Study', 'Exercise', 'Meals', 'Rest'],
                newTask: 'New task', standup: 'Standup', walk: 'Walk',
                n: n => `${N(n)} ${n == 1 ? 'cell' : 'cells'} selected`,
                fromTask: n => `Color comes from task “${iso(n)}”`,
                fromTasks: 'Color comes from the selected tasks',
                applied: (a, b) => `Color applied to ${N(a)} of ${N(b)} cells`,
                used: n => `${N(n)} ${n == 1 ? 'cell' : 'cells'}`,
                delMsg: (n, a, b) => `“${iso(n)}” is used in ${N(a)} cells, with ${N(b)} captions. Delete it together with those captions?`,
                impMsg: 'Replace the current planner with this file?',
                bad: 'This file is not a valid planner export.',
                resetMsg: 'Replace everything with the sample data?',
                mem: 'Browser storage is unavailable. Changes live in memory only; use Export to keep them.'
            },
            fa: {
                app: 'برنامه هفتگی',
                days: ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'],
                undo: 'بازگردانی', redo: 'بازانجام', copy: 'کپی', paste: 'چسباندن', clear: 'پاک کردن',
                exp: 'خروجی', imp: 'ورودی', reset: 'بازنشانی نمونه‌ها',
                sel: 'انتخاب', tasks: 'کارها', titleL: 'کار یا متن', capL: 'توضیح کوتاه', colorL: 'رنگ',
                mixed: 'ترکیبی', rng: 'بازه', tabC: 'خانه', more: 'بیشتر', close: 'بستن',
                save: 'ذخیره به‌عنوان کار', add: 'افزودن کار', no: 'انصراف', ok: 'تأیید',
                yes: 'بله، حذف شود', del: 'حذف', lang: 'فارسی', langToggle: 'زبان', digits: 'ارقام',
                samples: ['کار', 'مطالعه', 'ورزش', 'غذا', 'استراحت'],
                newTask: 'کار جدید', standup: 'جلسه', walk: 'پیاده‌روی',
                n: n => `${N(n)} خانه انتخاب شد`,
                fromTask: n => `رنگ از کار «${iso(n)}» می‌آید`,
                fromTasks: 'رنگ از کارهای انتخاب‌شده می‌آید',
                applied: (a, b) => `رنگ برای ${N(a)} از ${N(b)} خانه اعمال شد`,
                used: n => `${N(n)} خانه`,
                delMsg: (n, a, b) => `«${iso(n)}» در ${N(a)} خانه استفاده شده و ${N(b)} توضیح دارد. با توضیح‌ها حذف شود؟`,
                impMsg: 'برنامهٔ فعلی با این فایل جایگزین شود؟',
                bad: 'این فایل یک خروجی معتبر برنامه نیست.',
                resetMsg: 'همه‌چیز با داده‌های نمونه جایگزین شود؟',
                mem: 'ذخیره‌سازی مرورگر در دسترس نیست. تغییرات فقط در حافظه می‌مانند؛ برای نگه‌داشتن، خروجی بگیرید.'
            }
        };

        /* ---------- State Variables ---------- */
        let lang = 'en', latin = false, S = { tasks: [], cells: {} }, sel = { a: [0, START], b: [0, START] };
        let clip = null, drag = false, un = [], re = [], mem = false, dirty = false, ai = -1, sgl = [];
        let nf, coll, EL = {};

        const iso = s => '\u2068' + s + '\u2069';
        const tr = (k, ...a) => { const v = L[lang][k]; return typeof v == 'function' ? v(...a) : v };
        const N = x => nf.format(x);
        const rtl = () => lang == 'fa';
        const uid = () => Math.random().toString(36).slice(2, 8);
        const key = (d, h) => d + '-' + h;

        /* DOM Elements */
        const G = $('#G'), W = $('#gridWrapper'), ti = $('#ti'), ca = $('#ca'), sg = $('#sg'), sa = $('#sa'), saWrap = $('#saWrap');
        const TL = $('#TL'), col = $('#col'), fi = $('#fi'), sidePanel = $('#sidePanel'), sheetBackdrop = $('#bottomSheetBackdrop');
        const undoBtn = $('#undoBtn'), redoBtn = $('#redoBtn'), rngBtn = $('#rngBtn'), menuBtn = $('#menuBtn');
        const menuPopover = $('#menuPopover'), menuBackdrop = $('#menuBackdrop');
        const dialogBackdrop = $('#dialogBackdrop'), dialogMsg = $('#dialogMsg'), dialogCancelBtn = $('#dialogCancelBtn'), dialogConfirmBtn = $('#dialogConfirmBtn');
        const tabCellBtn = $('#tabCellBtn'), tabTasksBtn = $('#tabTasksBtn'), secCell = $('#secCell'), secTasks = $('#secTasks');

        /* ---------- Storage & Validation ---------- */
        const LS = {
            load() {
                try {
                    const item = localStorage.getItem('planner.v1');
                    return item ? JSON.parse(item) : null;
                } catch {
                    mem = true;
                    return null;
                }
            },
            save() {
                try {
                    localStorage.setItem('planner.v1', JSON.stringify({ v: 1, tasks: S.tasks, cells: S.cells, lang, latin }));
                } catch {
                    mem = true;
                }
            }
        };
        const save = () => LS.save();

        function ok(d) {
            return !!(d && Array.isArray(d.tasks) && d.cells && typeof d.cells == 'object' &&
                d.tasks.every(k => k && typeof k.id == 'string' && typeof k.name == 'string' && HEX.test(k.color)));
        }

        function clean(d) {
            const ids = new Set(d.tasks.map(k => k.id)), cells = {};
            for (const [q, c] of Object.entries(d.cells)) {
                const [a, b] = q.split('-').map(Number);
                if (c && a >= 0 && a < ND && b >= START && b <= END) {
                    const x = {
                        t: ids.has(c.t) ? c.t : '',
                        x: String(c.x || ''),
                        c: String(c.c || ''),
                        k: HEX.test(c.k) ? c.k : ''
                    };
                    if (x.t) x.k = '';
                    if (x.t || x.x || x.c || x.k) cells[q] = x;
                }
            }
            return { tasks: d.tasks.map(k => ({ id: k.id, name: k.name, color: k.color })), cells };
        }

        /* ---------- OKLCH Tinted Text Contrast Engine ---------- */
        const lin = c => c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
        const gam = c => c <= .0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - .055;
        const rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16) / 255);
        const lum = ([r, g, b]) => .2126 * r + .7152 * g + .0722 * b;
        const ic = {};

        function lab(h) {
            const [r, g, b] = rgb(h).map(lin);
            const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b);
            const m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b);
            const s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
            return [
                .2104542553 * l + .793617785 * m - .0040720468 * s,
                1.9779984951 * l - 2.428592205 * m + .4505937099 * s,
                .0259040371 * l + .7827717662 * m - .808675766 * s
            ];
        }

        function mk(L2, C, H) {
            const a = C * Math.cos(H), b = C * Math.sin(H);
            const l = (L2 + .3963377774 * a + .2158037573 * b) ** 3;
            const m = (L2 - .1055613458 * a - .0638541728 * b) ** 3;
            const s = (L2 - .0894841775 * a - 1.291485548 * b) ** 3;
            return [
                4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
                -.0041960863 * l - .7034186147 * m + 1.707614701 * s
            ].map(v => Math.min(1, Math.max(0, v)));
        }

        const hex = a => '#' + a.map(v => Math.round(gam(v) * 255).toString(16).padStart(2, '0')).join('');

        function ink(bg) {
            return ic[bg] || (ic[bg] = (() => {
                const [l, a, b] = lab(bg), H = Math.atan2(b, a), C = Math.min(Math.hypot(a, b), .13), y = lum(rgb(bg).map(lin));
                for (let d = .04; d <= 1; d += .02) {
                    for (const s of [1, -1]) {
                        const L2 = l + s * d;
                        if (L2 < 0 || L2 > 1) continue;
                        const x = mk(L2, C, H), z = lum(x);
                        if ((Math.max(y, z) + .05) / (Math.min(y, z) + .05) >= 4.8) return hex(x);
                    }
                }
                return y > .18 ? '#111111' : '#ffffff';
            })());
        }

        const nextColor = () => PAL.find(c => !S.tasks.some(k => k.color.toLowerCase() == c)) || PAL[S.tasks.length % PAL.length];

        /* ---------- Data Operations & History ---------- */
        function put(d, h, p) {
            const q = key(d, h), c = { ...S.cells[q], ...p };
            if (c.t) c.k = '';
            (!c.t && !c.x && !c.c && !c.k) ? delete S.cells[q] : S.cells[q] = c;
        }

        const snap = () => JSON.stringify(S);

        function act(f) {
            un.push(snap());
            if (un.length > 100) un.shift();
            re = [];
            f();
            save();
            render();
        }

        function undo() {
            if (!un.length) return;
            re.push(snap());
            S = JSON.parse(un.pop());
            save();
            render();
        }

        function redo() {
            if (!re.length) return;
            un.push(snap());
            S = JSON.parse(re.pop());
            save();
            render();
        }

        const R = () => ({
            d0: Math.min(sel.a[0], sel.b[0]),
            d1: Math.max(sel.a[0], sel.b[0]),
            h0: Math.min(sel.a[1], sel.b[1]),
            h1: Math.max(sel.a[1], sel.b[1])
        });

        const picked = () => {
            const r = R(), o = [];
            for (let d = r.d0; d <= r.d1; d++)
                for (let h = r.h0; h <= r.h1; h++)
                    o.push([d, h]);
            return o;
        };

        const each = f => picked().forEach(([d, h]) => f(d, h));
        const clr = () => act(() => each((d, h) => delete S.cells[key(d, h)]));

        function copy() {
            const r = R();
            clip = [];
            for (let h = r.h0; h <= r.h1; h++) {
                const row = [];
                for (let d = r.d0; d <= r.d1; d++) {
                    row.push({ ...(S.cells[key(d, h)] || {}) });
                }
                clip.push(row);
            }
            toast(tr('copy') + ' ✓');
        }

        function paste() {
            if (!clip) return;
            const r = R(), one = clip.length == 1 && clip[0].length == 1;
            act(() => {
                const ap = (d, h, c) => {
                    const x = { ...c };
                    if (x.t && !S.tasks.some(k => k.id == x.t)) x.t = '';
                    delete S.cells[key(d, h)];
                    put(d, h, x);
                };
                if (one) {
                    each((d, h) => ap(d, h, clip[0][0]));
                } else {
                    clip.forEach((row, i) => {
                        row.forEach((c, j) => {
                            const d = r.d0 + j, h = r.h0 + i;
                            if (d < ND && h <= END) ap(d, h, c);
                        });
                    });
                }
            });
            toast(tr('paste') + ' ✓');
        }

        function setColor(c) {
            act(() => each((d, h) => {
                const x = S.cells[key(d, h)];
                if (!x || !x.t) put(d, h, { k: c });
            }));
        }

        const assign = id => act(() => each((d, h) => put(d, h, { t: id, x: '', k: '' })));

        function seed() {
            S = {
                tasks: tr('samples').map((n, i) => ({ id: uid(), name: n, color: PAL[[2, 8, 0, 6, 10][i]] })),
                cells: {}
            };
            const [w, s, e, m, r] = S.tasks.map(k => k.id);
            for (let d = 0; d < ND; d++) {
                put(d, 6, { t: e });
                if (d < 5) {
                    for (let h = 9; h < 17; h++) put(d, h, { t: h == 13 ? m : w });
                } else {
                    put(d, 10, { t: r });
                }
            }
            put(0, 9, { c: tr('standup') });
            put(5, 16, { x: tr('walk'), k: PAL[1] });
        }

        /* ---------- Loose Task Matching & Normalization ---------- */
        const norm = s => s.toLowerCase()
            .replace(/ي/g, 'ی').replace(/ك/g, 'ک')
            .replace(/[\u200c\u064b-\u065f\u0670]/g, '')
            .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776)
            .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
            .replace(/\s+/g, ' ').trim();

        const gr = s => {
            s = ' ' + s + ' ';
            const o = new Set();
            for (let i = 0; i < s.length - 1; i++) {
                o.add(s.substr(i, 2));
                if (i < s.length - 2) o.add(s.substr(i, 3));
            }
            return o;
        };

        function usage() {
            const u = {};
            Object.values(S.cells).forEach(c => c.t && (u[c.t] = (u[c.t] || 0) + 1));
            return u;
        }

        function suggest(q) {
            q = norm(q);
            if (!q) return [...S.tasks].sort((a, b) => coll.compare(a.name, b.name));
            const u = usage(), gq = gr(q);
            return S.tasks.map(k => {
                const n = norm(k.name), gn = gr(n);
                let sh = 0;
                gq.forEach(g => gn.has(g) && sh++);
                let s = 2 * sh / (gq.size + gn.size);
                if (n.includes(q)) s += .5;
                let i = 0;
                for (const ch of n) if (ch == q[i]) i++;
                if (i == q.length) s += .25;
                return { k, s, r: s + Math.min(u[k.id] || 0, 20) * .005 };
            }).filter(x => x.s > .12).sort((a, b) => b.r - a.r).slice(0, 5).map(x => x.k);
        }

        /* ---------- Grid & Panel Rendering ---------- */
        function renderGrid() {
            G.textContent = '';
            EL = {};
            const add = (c, x, at = {}) => {
                const e = document.createElement('div');
                e.className = c;
                e.textContent = x;
                for (const k in at) e.setAttribute(k, at[k]);
                G.append(e);
                return e;
            };

            add('corner', '');
            tr('days').forEach((n, d) => add('hd', n, { 'data-hd': d, role: 'columnheader' }));

            for (let h = START; h <= END; h++) {
                add('hh', `${N(h)}:${N(0)}${N(0)}`, { 'data-hh': h, role: 'rowheader' });
                for (let d = 0; d < ND; d++) {
                    const c = S.cells[key(d, h)] || {}, tk = S.tasks.find(x => x.id == c.t);
                    const bg = tk ? tk.color : c.k;
                    const e = add('c', '', { 'data-d': d, 'data-h': h, role: 'gridcell' });
                    const tx = tk ? tk.name : c.x;

                    if (bg) {
                        e.style.background = bg;
                        e.style.color = ink(bg);
                    }
                    if (tx) {
                        const b = document.createElement('b');
                        b.dir = 'auto';
                        b.textContent = tx;
                        e.append(b);
                    }
                    if (c.c) {
                        const i = document.createElement('i');
                        i.dir = 'auto';
                        i.textContent = c.c;
                        e.append(i);
                    }
                    EL[key(d, h)] = e;
                }
            }
            paintSel();
        }

        function paintSel() {
            const r = R();
            for (const q in EL) {
                const [d, h] = q.split('-').map(Number);
                EL[q].classList.toggle('sel', d >= r.d0 && d <= r.d1 && h >= r.h0 && h <= r.h1);
                EL[q].classList.toggle('cur', d == sel.b[0] && h == sel.b[1]);
            }
            panel();
        }

        function panel() {
            const ps = picked(), cs = ps.map(([d, h]) => S.cells[key(d, h)] || {});
            const tk = cs.map(c => S.tasks.find(x => x.id == c.t)), same = a => a.every(v => v === a[0]);

            $('#cnt').textContent = tr('n', ps.length);
            const ts = cs.map((c, i) => tk[i] ? tk[i].name : c.x || '');
            const cp = cs.map(c => c.c || '');

            ti.value = same(ts) ? ts[0] : '';
            ti.placeholder = same(ts) ? '' : tr('mixed');
            ca.value = same(cp) ? cp[0] : '';
            ca.placeholder = same(cp) ? '' : tr('mixed');

            dirty = false;
            sg.hidden = true;
            saWrap.hidden = true;
            sa.checked = true;

            const nt = tk.filter(Boolean).length, free = ps.length - nt;
            col.classList.toggle('off', free == 0);
            $('#pal').inert = free == 0;
            $('#cnote').textContent = free == 0
                ? (same(tk.map(x => x.id)) ? tr('fromTask', tk[0].name) : tr('fromTasks'))
                : nt ? tr('applied', free, ps.length) : '';
        }

        function renderTasks() {
            TL.textContent = '';
            const u = usage();
            [...S.tasks].sort((a, b) => coll.compare(a.name, b.name)).forEach(k => {
                const li = document.createElement('li');
                const cp = document.createElement('input');
                const nm = document.createElement('input');
                const us = document.createElement('small');
                const b = document.createElement('button');

                cp.type = 'color';
                cp.value = k.color;
                nm.type = 'text';
                nm.value = k.name;
                nm.dir = 'auto';
                us.textContent = tr('used', u[k.id] || 0);
                b.className = 'btn-del';
                b.textContent = '✕';
                b.title = tr('del');

                cp.onchange = () => act(() => { k.color = cp.value });
                nm.onchange = () => {
                    const v = nm.value.trim();
                    v ? act(() => { k.name = v }) : nm.value = k.name;
                };
                b.onclick = () => delTask(k);

                li.append(cp, nm, us, b);
                TL.append(li);
            });
        }

        function render() {
            renderGrid();
            renderTasks();
            const w = $('#warn');
            w.hidden = !mem;
            w.textContent = tr('mem');
            undoBtn.disabled = !un.length;
            redoBtn.disabled = !re.length;
        }

        function applyLang() {
            const r = document.documentElement;
            r.lang = lang;
            r.dir = rtl() ? 'rtl' : 'ltr';
            nf = new Intl.NumberFormat(rtl() && !latin ? 'fa-IR' : 'en');
            coll = new Intl.Collator(lang);

            document.querySelectorAll('[data-i]').forEach(e => e.textContent = tr(e.dataset.i));
            document.title = tr('app');
            document.querySelectorAll('[data-t]').forEach(e => {
                e.title = tr(e.dataset.t);
                e.setAttribute('aria-label', e.title);
            });

            $('#lgVal').textContent = rtl() ? 'FA' : 'EN';
            $('#digItem').hidden = !rtl();
            $('#dgVal').textContent = latin ? '۱۲۳' : '123';
        }

        /* ---------- Custom Modal Dialog & Toast ---------- */
        let dialogResolve = null;

        function ask(msg, confirmTextKey = 'ok') {
            return new Promise(resolve => {
                dialogResolve = resolve;
                dialogMsg.textContent = msg;
                dialogConfirmBtn.textContent = tr(confirmTextKey);
                dialogBackdrop.hidden = false;
                dialogConfirmBtn.focus();
            });
        }

        function closeDialog(result) {
            dialogBackdrop.hidden = true;
            if (dialogResolve) {
                dialogResolve(result);
                dialogResolve = null;
            }
        }

        dialogCancelBtn.onclick = () => closeDialog(false);
        dialogConfirmBtn.onclick = () => closeDialog(true);
        dialogBackdrop.onclick = e => { if (e.target === dialogBackdrop) closeDialog(false); };

        let toastTimer = null;
        function toast(msg) {
            const el = $('#toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        async function delTask(k) {
            const us = Object.values(S.cells).filter(c => c.t == k.id), caps = us.filter(c => c.c).length;
            if (us.length && !await ask(tr('delMsg', k.name, us.length, caps), 'yes')) return;
            act(() => {
                S.tasks = S.tasks.filter(x => x !== k);
                for (const q in S.cells) if (S.cells[q].t == k.id) delete S.cells[q];
            });
        }

        $('#addTaskBtn').onclick = () => act(() => S.tasks.push({ id: uid(), name: tr('newTask'), color: nextColor() }));

        /* ---------- Title Combobox Interactions ---------- */
        function sugg() {
            sgl = suggest(ti.value);
            ai = -1;
            sg.textContent = '';
            sgl.forEach(k => {
                const li = document.createElement('li');
                const sw = document.createElement('span');
                const n = document.createElement('span');
                li.setAttribute('role', 'option');
                sw.className = 'swatch';
                sw.style.background = k.color;
                n.dir = 'auto';
                n.textContent = k.name;
                li.append(sw, n);
                li.onpointerdown = e => {
                    e.preventDefault();
                    dirty = false;
                    assign(k.id);
                    G.focus();
                };
                sg.append(li);
            });
            sg.hidden = !sgl.length;
            ti.setAttribute('aria-expanded', !sg.hidden);
            const q = ti.value.trim().toLowerCase();
            saWrap.hidden = !(dirty && q && !S.tasks.some(k => k.name.trim().toLowerCase() == q));
        }

        const hl = () => [...sg.children].forEach((li, i) => li.setAttribute('aria-selected', i == ai));

        function commit() {
            const v = ti.value.trim();
            dirty = false;
            if (!v) return act(() => each((d, h) => put(d, h, { t: '', x: '' })));
            const ex = S.tasks.find(k => k.name.trim().toLowerCase() == v.toLowerCase());
            if (ex) return assign(ex.id);
            if (sa.checked && !saWrap.hidden) {
                const k = {
                    id: uid(),
                    name: v,
                    color: picked().map(([d, h]) => (S.cells[key(d, h)] || {}).k).find(Boolean) || nextColor()
                };
                act(() => {
                    S.tasks.push(k);
                    each((d, h) => put(d, h, { t: k.id, x: '', k: '' }));
                });
            } else {
                act(() => each((d, h) => put(d, h, { t: '', x: v })));
            }
        }

        ti.oninput = () => { dirty = true; sugg(); };
        ti.onfocus = sugg;
        ti.onblur = () => {
            sg.hidden = true;
            if (dirty) commit();
        };
        ti.onkeydown = e => {
            const k = e.key;
            if (k == 'ArrowDown' || k == 'ArrowUp') {
                e.preventDefault();
                if (sg.hidden) sugg();
                ai = (ai + 1 + (k == 'ArrowDown' ? 1 : -1) + sgl.length + 1) % (sgl.length + 1) - 1;
                hl();
            } else if (k == 'Enter') {
                e.preventDefault();
                if (ai >= 0) {
                    dirty = false;
                    assign(sgl[ai].id);
                } else {
                    commit();
                }
                G.focus();
            } else if (k == 'Escape') {
                dirty = false;
                panel();
                G.focus();
            }
        };

        ca.onchange = () => act(() => each((d, h) => put(d, h, { c: ca.value.trim() })));
        ca.onkeydown = e => {
            if (e.key == 'Enter') G.focus();
            if (e.key == 'Escape') { panel(); G.focus(); }
        };

        /* ---------- Palette Setup ---------- */
        const pal = $('#pal');
        ['', ...PAL].forEach(c => {
            const b = document.createElement('button');
            b.className = 'pal-btn' + (c ? '' : ' clear-color');
            b.dataset.c = c;
            b.title = c || '×';
            if (c) b.style.background = c; else b.textContent = '×';
            pal.append(b);
        });

        const cc = document.createElement('input');
        cc.type = 'color';
        cc.id = 'customColorInput';
        cc.title = 'Custom color';
        pal.append(cc);

        pal.onclick = e => {
            const b = e.target.closest('button');
            if (b) setColor(b.dataset.c);
        };
        cc.onchange = () => setColor(cc.value);

        /* ---------- Grid Interactions (Mouse, Touch, Keyboard) ---------- */
        let rng = false, pt = 'mouse';
        const SEL = '[data-d],[data-hd],[data-hh]';

        function hit(c, shift) {
            const D = c.dataset;
            let cell = false;
            if (D.hd != null) {
                sel = { a: [+D.hd, START], b: [+D.hd, END] };
            } else if (D.hh != null) {
                sel = { a: [0, +D.hh], b: [ND - 1, +D.hh] };
            } else {
                const p = [+D.d, +D.h], one = sel.a[0] == sel.b[0] && sel.a[1] == sel.b[1];
                sel = shift || (rng && one && (p[0] != sel.a[0] || p[1] != sel.a[1]))
                    ? { a: sel.a, b: p }
                    : { a: p, b: p };
                cell = true;
            }
            paintSel();
            openSheet('peek');
            if (cell && !rng && EL[key(...sel.b)]) {
                EL[key(...sel.b)].scrollIntoView({ block: 'nearest', inline: 'nearest' });
            }
        }

        G.onpointerdown = e => {
            pt = e.pointerType;
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                document.activeElement.blur();
            }
            const c = e.target.closest(SEL);
            if (!c || (pt == 'touch' && !rng)) return;
            e.preventDefault();
            G.focus({ preventScroll: true });
            hit(c, e.shiftKey);
            drag = c.dataset.d != null;
        };

        G.onclick = e => {
            const c = e.target.closest(SEL);
            if (c && pt == 'touch' && !rng) {
                G.focus({ preventScroll: true });
                hit(c, false);
            }
        };

        G.onpointermove = e => {
            if (!drag) return;
            const c = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-d]');
            if (c && (+c.dataset.d != sel.b[0] || +c.dataset.h != sel.b[1])) {
                sel.b = [+c.dataset.d, +c.dataset.h];
                paintSel();
            }
            if (rng) {
                const r = W.getBoundingClientRect();
                const dx = e.clientX > r.right - 48 ? 16 : e.clientX < r.left + 48 ? -16 : 0;
                const dy = e.clientY > r.bottom - 48 ? 16 : e.clientY < r.top + 48 ? -16 : 0;
                if (dx || dy) W.scrollBy(dx, dy);
            }
        };

        G.ondblclick = e => {
            if (!e.target.closest('[data-d]')) return;
            setTab('c');
            openSheet('full');
            ti.focus();
            ti.select();
        };

        addEventListener('pointerup', () => drag = false);
        addEventListener('pointercancel', () => drag = false);

        G.onkeydown = e => {
            const k = e.key, m = e.ctrlKey || e.metaKey, kl = k.toLowerCase();
            if (m && kl == 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
            else if (m && kl == 'y') { e.preventDefault(); redo(); }
            else if (m && kl == 'c') { e.preventDefault(); copy(); }
            else if (m && kl == 'v') { e.preventDefault(); paste(); }
            else if (k == 'Delete' || k == 'Backspace') { e.preventDefault(); clr(); }
            else if (k == 'Enter' || k == 'F2') { e.preventDefault(); setTab('c'); openSheet('full'); ti.focus(); ti.select(); }
            else if (k.startsWith('Arrow')) {
                e.preventDefault();
                let dx = k == 'ArrowRight' ? 1 : k == 'ArrowLeft' ? -1 : 0;
                const dy = k == 'ArrowDown' ? 1 : k == 'ArrowUp' ? -1 : 0;
                if (rtl()) dx = -dx;
                const p = [
                    Math.min(ND - 1, Math.max(0, sel.b[0] + dx)),
                    Math.min(END, Math.max(START, sel.b[1] + dy))
                ];
                sel = e.shiftKey ? { a: sel.a, b: p } : { a: p, b: p };
                paintSel();
                if (EL[key(...p)]) EL[key(...p)].scrollIntoView({ block: 'nearest', inline: 'nearest' });
            }
        };

        /* ---------- Toolbar Actions & Menu ---------- */
        function exp() {
            const dataStr = JSON.stringify({ v: 1, tasks: S.tasks, cells: S.cells }, null, 1);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'weekly-planner.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            toast(tr('exp') + ' ✓');
        }

        fi.onchange = async () => {
            const f = fi.files[0];
            fi.value = '';
            if (!f) return;
            let d;
            try { d = JSON.parse(await f.text()); } catch {}
            if (!ok(d)) return toast(tr('bad'));
            if (await ask(tr('impMsg'))) {
                act(() => { S = clean(d); });
                toast(tr('imp') + ' ✓');
            }
        };

        const A = {
            undo, redo, copy, paste, clear: clr,
            exp, imp: () => fi.click(),
            reset: async () => {
                if (await ask(tr('resetMsg'))) {
                    act(seed);
                    toast(tr('reset') + ' ✓');
                }
            },
            lang: () => {
                lang = rtl() ? 'en' : 'fa';
                save();
                applyLang();
                render();
            },
            dig: () => {
                latin = !latin;
                save();
                applyLang();
                render();
            }
        };

        document.querySelectorAll('[data-a]').forEach(b => {
            b.onclick = () => {
                hideMenu();
                A[b.dataset.a]();
            };
        });

        /* --- Menu Popover Handling --- */
        function showMenu() {
            menuPopover.hidden = false;
            menuBackdrop.hidden = false;
        }

        function hideMenu() {
            menuPopover.hidden = true;
            menuBackdrop.hidden = true;
        }

        menuBtn.onclick = () => menuPopover.hidden ? showMenu() : hideMenu();
        menuBackdrop.onclick = hideMenu;

        /* ---------- Tabs & Sheet Logic ---------- */
        function setTab(tab) {
            tabCellBtn.classList.toggle('active', tab == 'c');
            tabTasksBtn.classList.toggle('active', tab == 't');
            secCell.hidden = tab != 'c';
            secTasks.hidden = tab != 't';
            if (tab == 't') openSheet('full');
        }

        tabCellBtn.onclick = () => setTab('c');
        tabTasksBtn.onclick = () => setTab('t');

        function openSheet(state) {
            if (window.innerWidth <= 768) {
                sidePanel.dataset.state = state;
                sheetBackdrop.classList.toggle('active', state === 'full');
                const pad = state === 'full' ? '80dvh' : '195px';
                W.style.paddingBottom = pad;
                W.style.scrollPaddingBottom = pad;
            } else {
                sidePanel.dataset.state = 'full';
                sheetBackdrop.classList.remove('active');
                W.style.paddingBottom = '0px';
                W.style.scrollPaddingBottom = '0px';
            }
        }

        sheetBackdrop.onclick = () => openSheet('peek');

        // Touch swipe handling on sheet header
        let touchStartY = 0, currentSheetY = 0;
        const handle = $('#sheetHandle');
        handle.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        handle.addEventListener('touchmove', e => {
            const dy = e.touches[0].clientY - touchStartY;
            if (dy < -40) openSheet('full');
            else if (dy > 40) openSheet('peek');
        }, { passive: true });

        handle.onclick = () => {
            openSheet(sidePanel.dataset.state === 'full' ? 'peek' : 'full');
        };

        rngBtn.onclick = e => {
            rng = !rng;
            G.classList.toggle('rng', rng);
            e.currentTarget.setAttribute('aria-pressed', rng);
            toast(rng ? 'Range mode ON' : 'Range mode OFF');
        };

        window.addEventListener('resize', () => {
            openSheet(sidePanel.dataset.state || 'peek');
        });

        /* ---------- Initialization ---------- */
        const d0 = LS.load();
        if (d0 && d0.v == 1 && ok(d0)) {
            S = clean(d0);
            lang = d0.lang == 'fa' ? 'fa' : 'en';
            latin = !!d0.latin;
        } else {
            lang = (navigator.language || '').startsWith('fa') ? 'fa' : 'en';
            seed();
        }

        applyLang();
        save();
        render();
        setTab('c');
        openSheet('peek');
    </script>
</body>

</html>
